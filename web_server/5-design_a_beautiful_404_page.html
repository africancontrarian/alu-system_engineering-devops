<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceci n'est pas une page | 404</title>
<style>
  :root {
    --wall-1: #efe6d6;
    --wall-2: #ddd0b8;
    --ink: #2a2218;
    --muted: #6d5f4b;
    --frame-1: #d8b25c;
    --frame-2: #8c6a24;
    --frame-3: #f3d98f;
    --canvas: #fffcf4;
    --plaque: #f7efdc;
    --accent: #b4432c;
    --shadow: rgba(40, 28, 10, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall-1: #2a251c;
      --wall-2: #151210;
      --ink: #f1e8d4;
      --muted: #b3a58b;
      --frame-2: #7a5b1d;
      --canvas: #332d22;
      --plaque: #3a3326;
      --accent: #ee8a6e;
      --shadow: rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 50% 25%, var(--wall-1) 0%, var(--wall-2) 100%);
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .exhibit {
    margin-bottom: 22px;
    font: 600 0.75rem/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .frame {
    padding: 18px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--frame-3), var(--frame-1) 40%, var(--frame-2));
    box-shadow: 0 18px 40px var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.25);
  }
  .canvas {
    padding: 30px 20px 24px;
    border-radius: 2px;
    background: var(--canvas);
    box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.18);
  }
  svg { display: block; width: 180px; height: auto; margin: 0 auto; overflow: visible; }
  .ghost { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 7; }
  .sheet { fill: var(--canvas); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .fold { fill: var(--wall-2); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .line { stroke: var(--muted); stroke-width: 4; stroke-linecap: round; opacity: 0.45; }
  .num { fill: var(--accent); font: italic 700 46px Georgia, "Times New Roman", serif; }
  .plaque {
    margin: 22px auto 0;
    padding: 16px 18px 18px;
    border-radius: 3px;
    background: var(--plaque);
    box-shadow: 0 6px 14px var(--shadow);
  }
  h1 { margin: 0 0 6px; font-size: 1.55rem; font-style: italic; line-height: 1.2; }
  .lead { margin: 0 0 12px; color: var(--muted); font-size: 1rem; }
  .meta {
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
    font: 0.8rem/1.7 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--muted);
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .home {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font: 600 0.9rem/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-decoration: none;
  }
  .home:hover, .home:focus-visible { filter: brightness(1.1); outline: 3px solid var(--frame-1); outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) {
    svg { animation: float 5s ease-in-out infinite; }
    .ghost { animation: drift 5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, 3px); } }
  }
</style>
</head>
<body>
  <main>
    <div class="exhibit">Gallery 404 &middot; Permanent collection</div>
    <div class="frame">
      <div class="canvas">
        <svg viewBox="0 0 200 240" role="img" aria-label="A blank sheet of paper with a dashed ghost outline behind it">
          <path class="ghost" fill="none" stroke="#b4432c" stroke-width="2.5" stroke-dasharray="7 7" d="M20 12h100l50 50v158H20z"/>
          <path class="sheet" fill="#fffcf4" stroke="#2a2218" stroke-width="3" stroke-linejoin="round" d="M32 22h100l40 40v158H32z"/>
          <path class="fold" fill="#ddd0b8" stroke="#2a2218" stroke-width="3" stroke-linejoin="round" d="M132 22v40h40z"/>
          <text class="num" fill="#b4432c" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="700" x="102" y="132" text-anchor="middle">404</text>
          <path class="line" fill="none" stroke="#6d5f4b" stroke-width="4" stroke-linecap="round" opacity="0.45" d="M56 164h92M56 184h70"/>
        </svg>
      </div>
    </div>
    <div class="plaque">
      <h1>Ceci n'est pas une page</h1>
      <p class="lead">This is not a page. It is an HTTP 404 that looks a lot like one.</p>
      <ul class="meta">
        <li><b>Medium:</b> status code, 404 Not Found</li>
        <li><b>Dimensions:</b> 0 pages &times; 0 bytes of content</li>
        <li><b>Year:</b> the moment the URL was mistyped</li>
      </ul>
      <a class="home" href="/">Return to the gallery</a>
    </div>
  </main>
</body>
</html>
